<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#050510" />
    <script>
      try {
        const theme =
          localStorage.getItem('digital-dimension-theme') === 'light'
            ? 'light'
            : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#fffaf4' : '#050510')
      } catch {
        /* The markup defaults to dark when storage is unavailable. */
      }
    </script>
    <title>Umme Amara | Front-End &amp; Mobile Developer</title>
